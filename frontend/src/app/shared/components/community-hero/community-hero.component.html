<section>
  <div
    class="overflow-hidden rounded-2xl border border-[var(--color-border)] bg-[var(--color-bg-alt)]"
  >
    <div class="h-48 sm:h-64">
      @if (heroUrl(); as heroUrl) {
        <img
          [src]="heroUrl"
          alt=""
          class="h-full w-full object-cover"
          fetchpriority="high"
          decoding="async"
        />
      } @else {
        <div
          class="flex h-full w-full flex-col items-center justify-center gap-2 text-[var(--color-text-muted)]"
        >
          <span class="material-symbols-outlined text-5xl" aria-hidden="true">landscape</span>
        </div>
      }
    </div>
  </div>

  <div
    class="relative z-10 -mt-10 flex flex-col gap-4 px-4 sm:flex-row sm:items-end sm:justify-between sm:px-6"
  >
    <div class="flex min-w-0 items-end gap-4">
      @if (logoUrl(); as logoUrl) {
        <img
          [src]="logoUrl"
          alt=""
          class="size-20 shrink-0 rounded-2xl border-4 border-[var(--color-bg)] bg-[var(--color-bg-card)] object-cover shadow-[var(--shadow-card)]"
          decoding="async"
        />
      } @else {
        <div
          class="flex size-20 shrink-0 items-center justify-center rounded-2xl border-4 border-[var(--color-bg)] bg-[var(--color-primary)] text-xl font-bold text-white shadow-[var(--shadow-card)]"
          aria-hidden="true"
        >
          {{ initials() }}
        </div>
      }
      <h1 class="mb-1 min-w-0 break-words text-2xl font-bold text-[var(--color-text)] sm:text-3xl">
        {{ name() }}
      </h1>
    </div>

    <div class="flex flex-wrap items-center gap-2 sm:mb-1">
      <ng-content />
    </div>
  </div>
</section>
