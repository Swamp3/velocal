<div class="mx-auto max-w-xl">
  <app-form-actions
    formId="postForm"
    [backLink]="backLink()"
    [backLabel]="(postId() ? 'communities.posts.backToPost' : 'communities.posts.back') | transloco"
    [saveLabel]="(postId() ? 'communities.posts.saveChanges' : 'communities.posts.publish') | transloco"
    [saving]="saving()"
  />

  <h1 class="mt-5 text-2xl font-bold text-[var(--color-text)]">
    {{ (postId() ? 'communities.posts.editTitle' : 'communities.posts.createTitle') | transloco }}
  </h1>

  @if (!loaded()) {
    <div class="mt-6 space-y-4">
      <ui-skeleton height="8rem" />
    </div>
  } @else {
    <form
      id="postForm"
      [formGroup]="form"
      (ngSubmit)="publish()"
      class="mt-6 space-y-5 rounded-2xl border border-[var(--color-border)] bg-[var(--color-bg-card)] p-6 shadow-[var(--shadow-card)]"
    >
      <ui-input
        [label]="'communities.posts.heading' | transloco"
        formControlName="title"
        [error]="titleError()"
      />
      <app-rich-text
        formControlName="body"
        [compact]="true"
        [placeholder]="'communities.posts.placeholder' | transloco"
      />
    </form>
  }
</div>
