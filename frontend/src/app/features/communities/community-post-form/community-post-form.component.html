<div class="mx-auto max-w-xl">
  <a
    [routerLink]="listLink()"
    class="inline-flex items-center gap-1.5 text-sm font-medium text-[var(--color-text-muted)] transition-colors hover:text-[var(--color-text)]"
  >
    <span class="material-symbols-outlined text-[16px]" aria-hidden="true">arrow_back</span>
    {{ 'communities.posts.back' | transloco }}
  </a>

  <h1 class="mt-5 text-2xl font-bold text-[var(--color-text)]">
    {{ 'communities.posts.createTitle' | transloco }}
  </h1>

  @if (!loaded()) {
    <div class="mt-6 space-y-4">
      <ui-skeleton height="8rem" />
    </div>
  } @else {
    <form
      [formGroup]="form"
      (ngSubmit)="publish()"
      class="mt-6 space-y-5 rounded-2xl border border-[var(--color-border)] bg-[var(--color-bg-card)] p-6 shadow-[var(--shadow-card)]"
    >
      <ui-input
        [label]="'communities.posts.heading' | transloco"
        formControlName="title"
        [error]="titleError()"
      />
      <app-rich-text
        formControlName="body"
        [compact]="true"
        [placeholder]="'communities.posts.placeholder' | transloco"
      />
      <div class="flex gap-3 pt-2">
        <ui-button type="submit" [loading]="saving()" [disabled]="saving()">
          {{ 'communities.posts.publish' | transloco }}
        </ui-button>
        <a [routerLink]="listLink()">
          <ui-button variant="outline" type="button">{{ 'common.cancel' | transloco }}</ui-button>
        </a>
      </div>
    </form>
  }
</div>
