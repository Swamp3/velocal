<div class="mt-4">
  <ui-button variant="outline" size="sm" type="button" (click)="toggle()">
    <span class="material-symbols-outlined text-[16px]" aria-hidden="true">edit_location</span>
    {{ 'events.detail.editMeetup' | transloco }}
  </ui-button>

  @if (open()) {
    <form
      [formGroup]="form"
      (ngSubmit)="save()"
      class="mt-3 space-y-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-bg-card)] p-4"
    >
      <div>
        <label for="meetup-place" class="block text-sm text-[var(--color-text-muted)]">
          {{ 'events.detail.meetupPlace' | transloco }}
        </label>
        <input
          id="meetup-place"
          type="text"
          formControlName="meetupPlace"
          maxlength="200"
          class="mt-1 w-full rounded-[var(--radius-default)] border border-[var(--color-border)] bg-[var(--color-bg)] px-3 py-2 text-sm text-[var(--color-text)] focus:outline-2 focus:outline-offset-0 focus:outline-[var(--color-primary)]"
        />
      </div>
      <div>
        <label for="meetup-at" class="block text-sm text-[var(--color-text-muted)]">
          {{ 'events.detail.meetupTime' | transloco }}
        </label>
        <input
          id="meetup-at"
          type="datetime-local"
          formControlName="meetupAt"
          class="mt-1 w-full rounded-[var(--radius-default)] border border-[var(--color-border)] bg-[var(--color-bg)] px-3 py-2 text-sm text-[var(--color-text)] focus:outline-2 focus:outline-offset-0 focus:outline-[var(--color-primary)]"
        />
      </div>
      <div>
        <label for="meetup-note" class="block text-sm text-[var(--color-text-muted)]">
          {{ 'events.detail.meetupNote' | transloco }}
        </label>
        <textarea
          id="meetup-note"
          rows="3"
          formControlName="meetupNote"
          maxlength="2000"
          class="mt-1 w-full rounded-[var(--radius-default)] border border-[var(--color-border)] bg-[var(--color-bg)] px-3 py-2 text-sm text-[var(--color-text)] focus:outline-2 focus:outline-offset-0 focus:outline-[var(--color-primary)]"
        ></textarea>
      </div>
      <div class="flex gap-2">
        <ui-button
          type="submit"
          size="sm"
          [loading]="saving()"
          [disabled]="saving() || form.invalid"
        >
          {{ 'common.save' | transloco }}
        </ui-button>
        <ui-button type="button" size="sm" variant="ghost" (click)="toggle()">
          {{ 'common.cancel' | transloco }}
        </ui-button>
      </div>
    </form>
  }
</div>
